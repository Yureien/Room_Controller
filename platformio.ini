; Room Controller: AC IR, DS18B20 temperature, and Lotus Lamp BLE lighting.
[env:nodemcu-32s]
platform = espressif32 @ 7.1.3
board = nodemcu-32s
; Build the SDK from source so automatic light sleep can actually be enabled.
framework = arduino, espidf
extra_scripts = pre:scripts/platformio_build.py
board_build.partitions = partitions.csv
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_parity = N
monitor_filters = send_on_enter
monitor_echo = no
; Keep the USB serial adapter from asserting the board's reset/boot lines.
monitor_dtr = 0
monitor_rts = 0
lib_ldf_mode = deep+

; Fetch the experimental Blue Star implementation from the maintained fork.
lib_deps =
    WiFi
    ESPmDNS
    WebServer
    Preferences
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6
    h2zero/NimBLE-Arduino @ 2.5.1
    https://github.com/Yureien/IRremoteESP8266.git#bluestar-ie318yku
