; Room Controller: AC IR, DS18B20 temperature, and Lotus Lamp BLE lighting.
[env:nodemcu-32s]
platform = espressif32 @ 7.1.3
board = nodemcu-32s
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_parity = N
monitor_filters = send_on_enter
monitor_echo = no
; Keep the USB serial adapter from asserting the board's reset/boot lines.
monitor_dtr = 0
monitor_rts = 0
lib_ldf_mode = deep+

; Use the adjacent checkout with experimental Blue Star support.
; Changes in that checkout are available immediately through the local link.
lib_deps =
    WiFi
    ESPmDNS
    WebServer
    Preferences
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6
    h2zero/NimBLE-Arduino @ 2.5.1
    symlink://../IRremoteESP8266
; To use the fork, replace only the symlink dependency above with:
;     https://github.com/Yureien/IRremoteESP8266.git#bluestar-ie318yku
